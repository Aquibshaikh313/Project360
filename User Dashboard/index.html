<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Directory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <header class="masthead">
        <div class="masthead-label">Directory</div>
        <h1>User Manager</h1>
        <p class="subhead">A running index of every registered user, searchable by name or country.</p>
      </header>

      <div class="toolbar">
        <div class="toolbar-field toolbar-field--grow">
          <svg class="icon-search" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.5" />
            <path d="M11 11L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <input type="text" id="searchInput" placeholder="Search by name or country" />
        </div>
        <div class="toolbar-field">
          <select id="countrySelect">
            <option value="">All countries</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UAE">UAE</option>
          </select>
        </div>
      </div>

      <div class="user-list" id="userList"></div>
      <p class="empty-state" id="emptyState" hidden>No users match that search.</p>

      <div class="bottom-sections">
        <section class="panel" id="userStats">
          <h2 class="panel-title">By country</h2>
          <div class="panel-body"></div>
        </section>

        <section class="panel" id="userGreetings">
          <h2 class="panel-title">Current results</h2>
          <div class="panel-body"></div>
        </section>

        <section class="panel" id="userKeys">
          <h2 class="panel-title">Record fields</h2>
          <div class="panel-body"></div>
        </section>

        <section class="panel" id="nameCountryPairs">
          <h2 class="panel-title">Name / country</h2>
          <div class="panel-body"></div>
        </section>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
